# .readthedocs.yaml
# Read the Docs configuration file (https://docs.readthedocs.io/en/stable/config-file/v2.html)
#
# Modelled on pynbody's .readthedocs.yaml (https://github.com/pynbody/pynbody/blob/master/.readthedocs.yaml).
# Deliberately NOT copied: pynbody's pre_build steps that fetch test data and symlink it into docs/, and its
# post_build step that copies matplotlib `.. plot::` output into place. Neither is needed yet because tangos'
# tutorials are plain markdown/pre-executed notebook, not live `.. ipython::`/`.. plot::` blocks that need
# test data at build time. If/when the tutorials become executable, this will need equivalent pre_build data
# staging (see the accompanying report for what that entails).

version: 2

build:
   os: ubuntu-22.04
   tools:
     python: "3.13"
   apt_packages:
     - pandoc  # required by nbsphinx to render the markdown/rich-output cells of the tutorial notebook

sphinx:
   configuration: docs/conf.py
   # The build is warning-free and must stay that way; see "Invariants" in
   # DOCS_PLAN.md. If this starts failing on a stale checkout rather than on CI,
   # remove docs/reference/_autosummary/ -- see the same file.
   fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
